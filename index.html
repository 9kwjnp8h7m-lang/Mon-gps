<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mon-gps</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
body{background:#111;overflow:hidden}

#map{position:absolute;inset:0}

.top{
position:absolute;top:12px;left:12px;right:12px;
z-index:1000;background:#171717;color:white;
border-radius:16px;padding:12px;box-shadow:0 3px 15px #0008
}

.search{
display:flex;gap:8px
}
#destination{
flex:1;border:0;border-radius:12px;padding:13px;
font-size:16px;outline:none
}
#searchBtn{
border:0;border-radius:12px;padding:0 16px;
background:#28a745;color:white;font-size:20px
}

#results{
margin-top:8px;display:none;background:white;color:#111;
border-radius:10px;overflow:hidden
}
.result{
padding:12px;border-bottom:1px solid #ddd;
font-size:14px
}

.route{
margin-top:10px;font-size:18px;font-weight:bold
}
.route small{font-weight:normal;color:#bbb}

.speed{
position:absolute;top:155px;left:12px;z-index:1000;
background:#171717;color:white;border-radius:14px;
padding:10px 15px;text-align:center
}
.speed strong{font-size:30px}
.speed small{display:block;color:#aaa}

.alert{
position:absolute;top:155px;right:12px;z-index:1000;
background:#d71920;color:white;border-radius:14px;
padding:10px;font-weight:bold;display:none
}

.buttons{
position:absolute;right:12px;bottom:135px;z-index:1000;
display:flex;flex-direction:column;gap:10px
}
.buttons button{
width:48px;height:48px;border:0;border-radius:50%;
background:white;font-size:21px;box-shadow:0 2px 8px #0005
}

.bottom{
position:absolute;left:0;right:0;bottom:0;z-index:1000;
background:#171717;color:white;border-radius:22px 22px 0 0;
padding:14px 12px 8px
}
.info{text-align:center;margin-bottom:10px}
#eta{font-size:22px;font-weight:bold}
#distance{color:#aaa}

.nav{
display:flex;justify-content:space-around
}
.nav button{
background:none;border:0;color:#aaa;font-size:11px
}
.nav b{display:block;font-size:20px;margin-bottom:3px}

.status{
text-align:center;font-size:12px;color:#aaa;margin-top:5px
}
</style>
</head>

<body>

<div id="map"></div>

<div class="top">
  <div class="search">
    <input id="destination" placeholder="Où allez-vous ?">
    <button id="searchBtn">🔍</button>
  </div>

  <div id="results"></div>

  <div class="route" id="routeInfo">
    🚗 Prêt à partir
    <small id="routeSmall">Activez le GPS</small>
  </div>
</div>

<div class="speed">
  <strong id="speed">0</strong>
  <small>km/h</small>
</div>

<div class="alert" id="alert">
  ⚠️ Ralentissez
</div>

<div class="buttons">
  <button id="locationBtn">📍</button>
  <button id="soundBtn">🔊</button>
  <button id="reportBtn">⚠️</button>
</div>

<div class="bottom">
  <div class="info">
    <div id="eta">-- min</div>
    <div id="distance">Choisissez une destination</div>
  </div>

  <div class="nav">
    <button><b>⌂</b>Accueil</button>
    <button><b>➤</b>Itinéraire</button>
    <button><b>⚠</b>Signalements</button>
    <button><b>★</b>Favoris</button>
    <button><b>•••</b>Plus</button>
  </div>

  <div class="status" id="status">
    GPS en attente
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map").setView([43.12,5.93],13);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);

let positionMarker=null;
let accuracyCircle=null;
let watchId=null;
let currentPosition=null;
let destination=null;
let routeLine=null;
let soundOn=true;

/* GPS */

function startGPS(){

  if(!navigator.geolocation){
    document.getElementById("status").textContent =
      "GPS non disponible";
    return;
  }

  document.getElementById("status").textContent =
    "Recherche de votre position…";

  watchId=navigator.geolocation.watchPosition(
    updatePosition,
    gpsError,
    {
      enableHighAccuracy:true,
      maximumAge:1000,
      timeout:15000
    }
  );
}

function updatePosition(pos){

  const lat=pos.coords.latitude;
  const lon=pos.coords.longitude;

  currentPosition=[lat,lon];

  let speed=pos.coords.speed;

  if(speed==null || speed<0){
    speed=0;
  }

  speed=speed*3.6;

  document.getElementById("speed").textContent=
    Math.round(speed);

  document.getElementById("status").textContent=
    "GPS actif • Position en direct";

  if(!positionMarker){

    positionMarker=L.marker(
      [lat,lon],
      {title:"Ma position"}
    ).addTo(map);

    positionMarker.bindPopup("📍 Vous êtes ici");

  }else{

    positionMarker.setLatLng([lat,lon]);

  }

  if(!accuracyCircle){

    accuracyCircle=L.circle(
      [lat,lon],
      {
        radius:pos.coords.accuracy || 20,
        color:"#1877f2",
        fillOpacity:.1
      }
    ).addTo(map);

  }else{

    accuracyCircle.setLatLng([lat,lon]);
    accuracyCircle.setRadius(pos.coords.accuracy || 20);

  }

  if(!destination){
    map.setView([lat,lon],16);
  }

  if(destination){
    calculateRoute();
  }
}

function gpsError(error){

  document.getElementById("status").textContent=
    "Impossible d'obtenir le GPS";

  console.log(error);
}

/* RECHERCHE DESTINATION */

document.getElementById("searchBtn")
.addEventListener("click",searchDestination);

document.getElementById("destination")
.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    searchDestination();
  }
});

async function searchDestination(){

  const input=document
    .getElementById("destination")
    .value
    .trim();

  if(!input)return;

  const results=document.getElementById("results");

  results.style.display="block";
  results.innerHTML=
    "<div class='result'>🔎 Recherche…</div>";

  try{

    const url=
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2&limit=5&accept-language=fr&q=" +
      encodeURIComponent(input);

    const response=await fetch(url);

    const data=await response.json();

    results.innerHTML="";

    if(!data.length){

      results.innerHTML=
        "<div class='result'>Aucune destination trouvée</div>";

      return;
    }

    data.forEach(place=>{

      const div=document.createElement("div");

      div.className="result";

      div.textContent=place.display_name;

      div.onclick=function(){

        destination=[
          parseFloat(place.lat),
          parseFloat(place.lon)
        ];

        document.getElementById("destination").value=
          place.display_name.split(",")[0];

        results.style.display="none";

        L.marker(destination)
          .addTo(map)
          .bindPopup("🎯 Destination")
          .openPopup();

        if(currentPosition){
          calculateRoute();
        }else{

          map.setView(destination,15);

          document.getElementById("status")
            .textContent=
            "Activez le GPS pour calculer l'itinéraire";

        }
      };

      results.appendChild(div);

    });

  }catch(error){

    results.innerHTML=
      "<div class='result'>Erreur de recherche</div>";

    console.log(error);
  }
}

/* ITINERAIRE */

async function calculateRoute(){

  if(!currentPosition || !destination)return;

  try{

    const startLon=currentPosition[1];
    const startLat=currentPosition[0];

    const endLon=destination[1];
    const endLat=destination[0];

    const url=
      "https://router.project-osrm.org/route/v1/driving/" +
      startLon+","+startLat+";"+
      endLon+","+endLat+
      "?overview=full&geometries=geojson";

    const response=await fetch(url);

    const data=await response.json();

    if(!data.routes || !data.routes.length){
      throw new Error("Aucun itinéraire");
    }

    const route=data.routes[0];

    const distanceKm=route.distance/1000;

    const minutes=Math.max(
      1,
      Math.round(route.duration/60)
    );

    document.getElementById("eta").textContent=
      minutes+" min";

    document.getElementById("distance").textContent=
      distanceKm.toFixed(1)+" km";

    document.getElementById("routeInfo").innerHTML=
      "🚗 Itinéraire actif " +
      "<small>• "+distanceKm.toFixed(1)+" km</small>";

    if(routeLine){
      map.removeLayer(routeLine);
    }

    routeLine=L.geoJSON(
      route.geometry,
      {
        style:{
          weight:7,
          opacity:.85
        }
      }
    ).addTo(map);

    map.fitBounds(
      routeLine.getBounds(),
      {padding:[80,180]}
    );

  }catch(error){

    document.getElementById("status")
      .textContent=
      "Impossible de calculer l'itinéraire";

    console.log(error);
  }
}

/* BOUTON POSITION */

document.getElementById("locationBtn")
.addEventListener("click",function(){

  if(currentPosition){

    map.setView(
      currentPosition,
      17
    );

    positionMarker.openPopup();

  }else{

    startGPS();

  }
});

/* SON */

document.getElementById("soundBtn")
.addEventListener("click",function(){

  soundOn=!soundOn;

  this.textContent=
    soundOn ? "🔊" : "🔇";

});

/* SIGNALEMENT */

document.getElementById("reportBtn")
.addEventListener("click",function(){

  if(currentPosition){

    L.marker(currentPosition)
      .addTo(map)
      .bindPopup("⚠️ Signalement ajouté")
      .openPopup();

    document.getElementById("status")
      .textContent=
      "Signalement ajouté à votre position";

  }else{

    alert("Activez d'abord le GPS.");

  }

});

/* DEMARRAGE */

startGPS();

</script>

</body>
</html>
