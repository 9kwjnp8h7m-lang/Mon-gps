<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mon-gps</title>

<link
 rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 padding:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#111;
}

#map{
 position:absolute;
 inset:0;
 z-index:1;
}

.top{
 position:absolute;
 top:12px;
 left:12px;
 right:12px;
 z-index:1000;
 background:#171717;
 color:white;
 padding:18px;
 border-radius:22px;
 box-shadow:0 5px 20px #0008;
}

.search{
 display:flex;
 gap:12px;
}

#destination{
 flex:1;
 min-width:0;
 height:58px;
 border:0;
 border-radius:18px;
 padding:0 20px;
 font-size:20px;
 outline:none;
}

#searchBtn{
 width:94px;
 border:0;
 border-radius:18px;
 background:#22b84b;
 color:white;
 font-size:30px;
}

#status{
 margin-top:15px;
 font-size:20px;
 font-weight:700;
}

#results{
 display:none;
 margin-top:10px;
 background:white;
 color:#111;
 border-radius:15px;
 overflow:hidden;
}

.result{
 padding:14px;
 border-bottom:1px solid #ddd;
 font-size:16px;
}

.speed{
 position:absolute;
 top:190px;
 left:20px;
 z-index:1000;
 background:#171717;
 color:white;
 width:96px;
 padding:18px 8px;
 text-align:center;
 border-radius:20px;
}

#speed{
 font-size:40px;
 font-weight:800;
}

.speed small{
 font-size:17px;
 color:#aaa;
}

.buttons{
 position:absolute;
 right:18px;
 bottom:210px;
 z-index:1000;
 display:flex;
 flex-direction:column;
 gap:12px;
}

.round{
 width:64px;
 height:64px;
 border:0;
 border-radius:50%;
 background:white;
 box-shadow:0 3px 12px #0005;
 font-size:28px;
}

.bottom{
 position:absolute;
 left:0;
 right:0;
 bottom:0;
 z-index:1000;
 background:#171717;
 color:white;
 padding:20px 15px 16px;
 border-radius:28px 28px 0 0;
 text-align:center;
}

#time{
 font-size:32px;
 font-weight:800;
}

#distance{
 margin-top:3px;
 font-size:20px;
 color:#bbb;
}

.nav{
 margin-top:20px;
 display:flex;
 justify-content:space-around;
}

.nav button{
 background:none;
 border:0;
 color:#aaa;
 font-size:14px;
}

.nav span{
 display:block;
 font-size:25px;
 margin-bottom:4px;
}

#gpsStatus{
 margin-top:12px;
 color:#aaa;
 font-size:15px;
}

.leaflet-control-zoom{
 margin-top:170px !important;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="top">

 <div class="search">
   <input
    id="destination"
    type="text"
    placeholder="Où allez-vous ?"
    autocomplete="off"
   >
   <button id="searchBtn">🔎</button>
 </div>

 <div id="results"></div>

 <div id="status">
   🚗 Prêt à partir
 </div>

</div>

<div class="speed">
 <div id="speed">0</div>
 <small>km/h</small>
</div>

<div class="buttons">

 <button class="round" id="locationBtn">
   📍
 </button>

 <button class="round" id="soundBtn">
   🔊
 </button>

 <button class="round" id="reportBtn">
   ⚠️
 </button>

</div>

<div class="bottom">

 <div id="time">-- min</div>

 <div id="distance">
   Choisissez une destination
 </div>

 <div class="nav">

  <button>
   <span>⌂</span>
   Accueil
  </button>

  <button>
   <span>➤</span>
   Itinéraire
  </button>

  <button>
   <span>⚠️</span>
   Signalements
  </button>

  <button>
   <span>★</span>
   Favoris
  </button>

  <button>
   <span>•••</span>
   Plus
  </button>

 </div>

 <div id="gpsStatus">
   GPS en attente…
 </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;
let userMarker = null;
let destinationMarker = null;
let routeLine = null;

let userLat = null;
let userLon = null;

let selectedLat = null;
let selectedLon = null;

let watchId = null;

let soundOn = true;


/* =========================
   CARTE
========================= */

map = L.map("map", {
 zoomControl:true
}).setView([43.12,5.93],13);

L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  maxZoom:19,
  attribution:"© OpenStreetMap"
 }
).addTo(map);


/* =========================
   GPS
========================= */

function startGPS(){

 if(!navigator.geolocation){

  document.getElementById("gpsStatus").textContent =
   "GPS non disponible";

  return;
 }

 watchId = navigator.geolocation.watchPosition(

  position => {

   userLat = position.coords.latitude;
   userLon = position.coords.longitude;

   let speed = position.coords.speed;

   if(speed !== null && speed >= 0){

    let kmh = Math.round(speed * 3.6);

    document.getElementById("speed").textContent = kmh;

   }

   updateUserPosition();

   document.getElementById("gpsStatus").textContent =
    "GPS actif • Position en direct";

   if(selectedLat !== null){

    calculateRoute();

   }

  },

  error => {

   document.getElementById("gpsStatus").textContent =
    "Activez l'autorisation GPS";

   document.getElementById("status").textContent =
    "📍 GPS indisponible";

  },

  {
   enableHighAccuracy:true,
   maximumAge:1000,
   timeout:10000
  }

 );

}


function updateUserPosition(){

 if(!userMarker){

  userMarker = L.marker(
   [userLat,userLon]
  ).addTo(map);

  userMarker.bindPopup(
   "📍 Ma position"
  );

 }else{

  userMarker.setLatLng(
   [userLat,userLon]
  );

 }

}


/* =========================
   BOUTON POSITION
========================= */

document
.getElementById("locationBtn")
.addEventListener("click",function(){

 if(userLat === null){

  alert("Le GPS n'est pas encore disponible.");

  startGPS();

  return;
 }

 map.setView(
  [userLat,userLon],
  16
 );

});


/* =========================
   RECHERCHE
========================= */

document
.getElementById("searchBtn")
.addEventListener("click",searchDestination);


document
.getElementById("destination")
.addEventListener("keydown",function(e){

 if(e.key === "Enter"){
  searchDestination();
 }

});


async function searchDestination(){

 let input =
  document
  .getElementById("destination")
  .value
  .trim();

 if(!input){

  alert("Entrez une destination.");

  return;
 }

 let resultsBox =
  document.getElementById("results");

 resultsBox.style.display="block";

 resultsBox.innerHTML =
  "<div class='result'>🔎 Recherche…</div>";

 try{

  let url =
   "https://nominatim.openstreetmap.org/search" +
   "?format=jsonv2" +
   "&limit=5" +
   "&q=" +
   encodeURIComponent(input);

  let response =
   await fetch(url);

  let data =
   await response.json();

  if(!data.length){

   resultsBox.innerHTML =
    "<div class='result'>Aucune destination trouvée</div>";

   return;
  }

  resultsBox.innerHTML="";

  data.forEach(place => {

   let item =
    document.createElement("div");

   item.className="result";

   item.textContent =
    "📍 " + place.display_name;

   item.onclick=function(){

    selectedLat =
     parseFloat(place.lat);

    selectedLon =
     parseFloat(place.lon);

    resultsBox.style.display="none";

    document
    .getElementById("destination")
    .value =
     place.display_name;

    showDestination();

    calculateRoute();

   };

   resultsBox.appendChild(item);

  });

 }catch(error){

  resultsBox.innerHTML =
   "<div class='result'>Erreur de recherche</div>";

 }

}


/* =========================
   DESTINATION
========================= */

function showDestination(){

 if(destinationMarker){

  map.removeLayer(destinationMarker);

 }

 destinationMarker =
  L.marker(
   [selectedLat,selectedLon]
  ).addTo(map);

 destinationMarker
  .bindPopup("🎯 Destination")
  .openPopup();

}


/* =========================
   ITINERAIRE
========================= */

async function calculateRoute(){

 if(
  userLat === null ||
  selectedLat === null
 ){
  return;
 }

 try{

  document
  .getElementById("status")
  .textContent =
   "🚗 Calcul de l'itinéraire…";

  let url =
   "https://router.project-osrm.org/route/v1/driving/" +

   userLon + "," + userLat +

   ";" +

   selectedLon + "," + selectedLat +

   "?overview=full&geometries=geojson";

  let response =
   await fetch(url);

  let data =
   await response.json();

  if(
   !data.routes ||
   !data.routes.length
  ){

   document
   .getElementById("status")
   .textContent =
    "❌ Itinéraire introuvable";

   return;
  }

  let route =
   data.routes[0];

  let distanceKm =
   route.distance / 1000;

  let durationMin =
   Math.round(route.duration / 60);

  document
  .getElementById("time")
  .textContent =
   durationMin + " min";

  document
  .getElementById("distance")
  .textContent =
   distanceKm.toFixed(1) + " km";

  document
  .getElementById("status")
  .textContent =
   "🚗 Itinéraire actif";

  let coordinates =
   route.geometry.coordinates.map(
    point => [point[1],point[0]]
   );

  if(routeLine){

   map.removeLayer(routeLine);

  }

  routeLine =
   L.polyline(
    coordinates,
    {
     weight:7,
     opacity:0.9
    }
   ).addTo(map);

  let bounds =
   routeLine.getBounds();

  map.fitBounds(
   bounds,
   {
    padding:[40,180]
   }
  );

 }catch(error){

  console.error(error);

  document
  .getElementById("status")
  .textContent =
   "❌ Erreur de calcul";

 }

}


/* =========================
   SON
========================= */

document
.getElementById("soundBtn")
.addEventListener("click",function(){

 soundOn = !soundOn;

 this.textContent =
  soundOn ? "🔊" : "🔇";

});


/* =========================
   SIGNALEMENT
========================= */

document
.getElementById("reportBtn")
.addEventListener("click",function(){

 if(userLat === null){

  alert("Votre position GPS n'est pas encore disponible.");

  return;
 }

 L.marker(
  [userLat,userLon]
 ).addTo(map)
 .bindPopup(
  "⚠️ Signalement ajouté"
 )
 .openPopup();

});


/* =========================
   DEMARRAGE
========================= */

startGPS();

</script>

</body>
</html>
