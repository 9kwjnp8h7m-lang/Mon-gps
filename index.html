<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mon-gps</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#111;
}

#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.top{
  position:absolute;
  z-index:1000;
  top:18px;
  left:20px;
  right:20px;
  background:#171717;
  border-radius:28px;
  padding:30px 28px 25px;
  box-shadow:0 8px 30px #0005;
}

.searchRow{
  display:flex;
  gap:14px;
}

#search{
  flex:1;
  min-width:0;
  height:68px;
  border:0;
  border-radius:22px;
  padding:0 20px;
  font-size:24px;
  outline:none;
}

#searchBtn{
  width:76px;
  height:68px;
  border:0;
  border-radius:22px;
  background:#18b94b;
  font-size:32px;
}

.status{
  color:white;
  font-size:27px;
  font-weight:700;
  margin-top:24px;
}

.status span{
  color:#aaa;
  font-weight:400;
}

.suggestions{
  display:none;
  background:white;
  color:#111;
  margin-top:10px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 25px #0005;
}

.suggestion{
  padding:16px 18px;
  border-bottom:1px solid #ddd;
  font-size:17px;
}

.suggestion:last-child{
  border-bottom:0;
}

.suggestion strong{
  display:block;
  font-size:18px;
}

.suggestion small{
  color:#777;
}

.speed{
  position:absolute;
  z-index:1000;
  top:390px;
  left:32px;
  background:#171717;
  color:white;
  width:125px;
  height:165px;
  border-radius:28px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 25px #0004;
}

#speed{
  font-size:52px;
  font-weight:800;
}

.speed small{
  font-size:23px;
  color:#aaa;
}

.actionButtons{
  position:absolute;
  z-index:1000;
  right:20px;
  bottom:390px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.actionButtons button{
  width:80px;
  height:80px;
  border:0;
  border-radius:50%;
  background:white;
  font-size:32px;
  box-shadow:0 5px 20px #0004;
}

.bottom{
  position:absolute;
  z-index:1000;
  left:0;
  right:0;
  bottom:0;
  background:#171717;
  color:white;
  border-radius:32px 32px 0 0;
  padding:20px 18px 24px;
  text-align:center;
}

#time{
  font-size:40px;
  font-weight:800;
}

#distance{
  color:#aaa;
  font-size:25px;
  margin-top:3px;
}

.nav{
  display:flex;
  justify-content:space-around;
  margin-top:25px;
}

.nav button{
  background:none;
  border:0;
  color:white;
  font-size:16px;
}

.nav .icon{
  display:block;
  font-size:29px;
  margin-bottom:6px;
}

.gpsText{
  color:#aaa;
  font-size:18px;
  margin-top:18px;
}

.routeInfo{
  position:absolute;
  z-index:1000;
  top:345px;
  left:210px;
  right:20px;
  background:white;
  color:#111;
  padding:20px;
  border-radius:25px;
  box-shadow:0 7px 25px #0004;
  display:none;
}

.routeInfo strong{
  font-size:23px;
}

.routeInfo small{
  display:block;
  margin-top:8px;
  font-size:18px;
  color:#777;
}

@media(max-width:600px){
  .top{
    top:18px;
  }

  .speed{
    top:380px;
  }

  .routeInfo{
    top:345px;
    left:210px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="top">

  <div class="searchRow">
    <input
      id="search"
      type="search"
      placeholder="Où allez-vous ?"
      autocomplete="off"
    >

    <button id="searchBtn">🔎</button>
  </div>

  <div id="suggestions" class="suggestions"></div>

  <div class="status" id="status">
    🚗 Prêt à partir <span>Activez le GPS</span>
  </div>

</div>

<div class="speed">
  <div id="speed">0</div>
  <small>km/h</small>
</div>

<div id="routeInfo" class="routeInfo">
  <strong id="instruction">🚗 Itinéraire</strong>
  <small id="nextDistance"></small>
</div>

<div class="actionButtons">
  <button onclick="centerOnPosition()">📍</button>
  <button onclick="toggleSound()">🔊</button>
  <button onclick="report()">⚠️</button>
</div>

<div class="bottom">

  <div id="time">-- min</div>
  <div id="distance">Choisissez une destination</div>

  <div class="nav">
    <button>
      <span class="icon">⌂</span>
      Accueil
    </button>

    <button>
      <span class="icon">➤</span>
      Itinéraire
    </button>

    <button>
      <span class="icon">⚠</span>
      Signalements
    </button>

    <button>
      <span class="icon">★</span>
      Favoris
    </button>

    <button>
      <span class="icon">•••</span>
      Plus
    </button>
  </div>

  <div class="gpsText" id="gpsText">
    GPS en attente…
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;
let positionMarker = null;
let destinationMarker = null;
let routeLine = null;

let currentPosition = null;
let destination = null;

let searchTimer = null;
let soundOn = true;

/* =========================
   CARTE
========================= */

map = L.map("map").setView([45.1885,5.7245],13);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);


/* =========================
   GPS EN DIRECT
========================= */

if(navigator.geolocation){

  navigator.geolocation.watchPosition(

    function(pos){

      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      currentPosition = {
        lat:lat,
        lon:lon
      };

      let speedKmh = 0;

      if(pos.coords.speed !== null &&
         !isNaN(pos.coords.speed)){

        speedKmh = Math.max(
          0,
          Math.round(pos.coords.speed * 3.6)
        );
      }

      document.getElementById("speed").textContent =
        speedKmh;

      document.getElementById("gpsText").textContent =
        "GPS actif • Position en direct";

      document.getElementById("status").innerHTML =
        "🚗 GPS actif <span>Position en direct</span>";

      if(!positionMarker){

        positionMarker = L.marker(
          [lat,lon]
        ).addTo(map);

      }else{

        positionMarker.setLatLng([lat,lon]);

      }

      if(!destination){

        map.setView([lat,lon],16);

      }

    },

    function(error){

      document.getElementById("gpsText").textContent =
        "GPS non disponible";

      document.getElementById("status").innerHTML =
        "📍 Activez l'autorisation GPS";

    },

    {
      enableHighAccuracy:true,
      maximumAge:1000,
      timeout:10000
    }

  );

}else{

  document.getElementById("gpsText").textContent =
    "GPS non supporté";

}


/* =========================
   RECHERCHE AUTOMATIQUE
========================= */

const searchInput =
  document.getElementById("search");

const suggestions =
  document.getElementById("suggestions");

searchInput.addEventListener(
  "input",
  function(){

    const query =
      searchInput.value.trim();

    clearTimeout(searchTimer);

    if(query.length < 2){

      suggestions.style.display = "none";
      suggestions.innerHTML = "";
      return;

    }

    searchTimer = setTimeout(
      function(){

        searchPlaces(query);

      },
      350
    );

  }
);


/* =========================
   RECHERCHE NOMINATIM
========================= */

async function searchPlaces(query){

  try{

    let url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&limit=5" +
      "&accept-language=fr" +
      "&q=" +
      encodeURIComponent(query);

    const response =
      await fetch(url);

    const places =
      await response.json();

    suggestions.innerHTML = "";

    if(!places.length){

      suggestions.innerHTML =
        '<div class="suggestion">Aucun résultat</div>';

      suggestions.style.display = "block";

      return;
    }

    places.forEach(function(place){

      const item =
        document.createElement("div");

      item.className = "suggestion";

      const name =
        place.display_name
          .split(",")
          .slice(0,2)
          .join(",");

      const details =
        place.display_name
          .split(",")
          .slice(2,5)
          .join(",");

      item.innerHTML =
        "<strong>📍 " +
        escapeHtml(name) +
        "</strong>" +
        "<small>" +
        escapeHtml(details) +
        "</small>";

      item.addEventListener(
        "click",
        function(){

          selectDestination(place);

        }
      );

      suggestions.appendChild(item);

    });

    suggestions.style.display = "block";

  }catch(error){

    console.error(error);

    suggestions.innerHTML =
      '<div class="suggestion">Erreur de recherche</div>';

    suggestions.style.display = "block";

  }

}


/* =========================
   SÉLECTION DESTINATION
========================= */

function selectDestination(place){

  const lat =
    parseFloat(place.lat);

  const lon =
    parseFloat(place.lon);

  destination = {
    lat:lat,
    lon:lon,
    name:place.display_name
  };

  searchInput.value =
    place.display_name
      .split(",")
      .slice(0,2)
      .join(",");

  suggestions.style.display = "none";

  if(destinationMarker){

    map.removeLayer(destinationMarker);

  }

  destinationMarker =
    L.marker([lat,lon])
      .addTo(map)
      .bindPopup("🎯 Destination")
      .openPopup();

  document.getElementById("status").innerHTML =
    "🚗 Calcul de l'itinéraire…";

  if(currentPosition){

    calculateRoute();

  }else{

    document.getElementById("status").innerHTML =
      "📍 Activez le GPS pour calculer l'itinéraire";

    map.setView([lat,lon],13);

  }

}


/* =========================
   CALCUL ITINÉRAIRE OSRM
========================= */

async function calculateRoute(){

  if(!currentPosition || !destination){
    return;
  }

  const start =
    currentPosition.lon +
    "," +
    currentPosition.lat;

  const end =
    destination.lon +
    "," +
    destination.lat;

  const url =
    "https://router.project-osrm.org/route/v1/driving/" +
    start +
    ";" +
    end +
    "?overview=full&geometries=geojson";

  try{

    const response =
      await fetch(url);

    const data =
      await response.json();

    if(
      !data.routes ||
      !data.routes.length
    ){

      document.getElementById("status").innerHTML =
        "❌ Itinéraire impossible";

      return;
    }

    const route =
      data.routes[0];

    const distanceKm =
      route.distance / 1000;

    const durationMin =
      Math.round(route.duration / 60);

    if(routeLine){

      map.removeLayer(routeLine);

    }

    routeLine =
      L.geoJSON(
        route.geometry,
        {
          style:{
            color:"#1976ff",
            weight:7,
            opacity:0.9
          }
        }
      ).addTo(map);

    map.fitBounds(
      routeLine.getBounds(),
      {
        padding:[40,260]
      }
    );

    document.getElementById("time").textContent =
      durationMin + " min";

    document.getElementById("distance").textContent =
      distanceKm.toFixed(1) + " km";

    document.getElementById("status").innerHTML =
      "🚗 Itinéraire actif <span>• " +
      distanceKm.toFixed(1) +
      " km</span>";

    document.getElementById("routeInfo").style.display =
      "block";

    document.getElementById("instruction").textContent =
      "🚗 Prenez la route";

    document.getElementById("nextDistance").textContent =
      "Destination : " +
      destination.name.split(",")[0];

  }catch(error){

    console.error(error);

    document.getElementById("status").innerHTML =
      "❌ Erreur de calcul";

  }

}


/* =========================
   BOUTON LOUPE
========================= */

document.getElementById("searchBtn")
  .addEventListener(
    "click",
    function(){

      const query =
        searchInput.value.trim();

      if(query.length >= 2){

        searchPlaces(query);

      }

    }
  );


/* =========================
   POSITION
========================= */

function centerOnPosition(){

  if(!currentPosition){

    alert(
      "La position GPS n'est pas encore disponible."
    );

    return;
  }

  map.setView(
    [
      currentPosition.lat,
      currentPosition.lon
    ],
    16
  );

}


/* =========================
   SON
========================= */

function toggleSound(){

  soundOn = !soundOn;

  const button =
    document.querySelectorAll(
      ".actionButtons button"
    )[1];

  button.textContent =
    soundOn ? "🔊" : "🔇";

}


/* =========================
   SIGNALEMENT
========================= */

function report(){

  if(!currentPosition){

    alert(
      "Position GPS indisponible."
    );

    return;

  }

  L.marker([
    currentPosition.lat,
    currentPosition.lon
  ])
  .addTo(map)
  .bindPopup(
    "⚠️ Signalement ajouté"
  )
  .openPopup();

}


/* =========================
   SÉCURITÉ HTML
========================= */

function escapeHtml(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   FERMER SUGGESTIONS
========================= */

document.addEventListener(
  "click",
  function(event){

    if(
      !searchInput.contains(event.target) &&
      !suggestions.contains(event.target)
    ){

      suggestions.style.display = "none";

    }

  }
);

</script>

</body>
</html>
