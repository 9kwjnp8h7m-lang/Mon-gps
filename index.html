<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPS Prototype</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#071018;color:#fff;overflow:hidden}
#map{position:absolute;inset:0;z-index:0}
.panel{position:absolute;left:12px;right:12px;z-index:10;background:rgba(8,15,22,.94);border:1px solid rgba(255,255,255,.14);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.top{top:calc(12px + env(safe-area-inset-top));padding:18px 18px 14px;display:flex;align-items:center;gap:14px}
.arrow{font-size:48px;line-height:1;transform:rotate(-25deg)}
.distance{font-size:30px;font-weight:800}.road{font-size:18px;margin-top:2px;color:#d9e2e8}
.exit{margin-left:auto;border:1px solid #fff;border-radius:10px;padding:9px 10px;font-weight:800;white-space:nowrap}
.speedbox{position:absolute;left:18px;bottom:150px;z-index:10;width:112px;text-align:center;background:rgba(7,13,19,.94);border-radius:22px;padding:10px 8px}
.limit{width:62px;height:62px;margin:-35px auto 2px;border:5px solid #fff;border-radius:50%;background:#f5f5f5;color:#111;display:grid;place-items:center;font-size:23px;font-weight:900}
.speed{font-size:36px;font-weight:900}.unit{font-size:14px;color:#aab6be}
.alert{position:absolute;left:50%;transform:translateX(-50%);bottom:255px;z-index:11;background:#101820;border:2px solid #ff334b;border-radius:16px;padding:9px 15px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.35)}
.alert b{display:block;font-size:16px}.alert span{font-size:14px;color:#ff9ba6}
.controls{position:absolute;right:14px;bottom:165px;z-index:10;display:flex;flex-direction:column;gap:10px}
.btn{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(8,15,22,.94);color:#fff;font-size:22px}
.bottom{bottom:0;border-radius:25px 25px 0 0;padding:12px 14px calc(10px + env(safe-area-inset-bottom));text-align:center}
.eta{font-size:34px;font-weight:800}.sub{color:#b8c2c9;margin:2px 0 12px}.nav{display:flex;justify-content:space-around;border-top:1px solid rgba(255,255,255,.1);padding-top:10px}
.nav button{background:none;border:0;color:#d5dde2;font-size:12px}.nav b{display:block;font-size:22px;margin-bottom:3px}
.locate{font-size:12px;color:#8bd1ff;margin-top:8px}
.leaflet-control-attribution{display:none}
</style>
</head>
<body>
<div id="map"></div>

<div class="panel top">
  <div class="arrow">↗</div>
  <div><div class="distance">1,2 km</div><div class="road">A8 · Toulon – Hyères</div></div>
  <div class="exit">Sortie 36</div>
</div>

<div class="alert"><b>⚠ Radar fixe · 500 m</b><span>Ralentissez</span></div>

<div class="speedbox">
  <div class="limit" id="limit">110</div>
  <div class="speed" id="speed">--</div>
  <div class="unit">km/h</div>
</div>

<div class="controls">
  <button class="btn" id="sound" title="Son">🔊</button>
  <button class="btn" id="report" title="Signaler">⚠️</button>
  <button class="btn" id="locate" title="Ma position">⌖</button>
</div>

<div class="panel bottom">
  <div class="eta">24 min</div>
  <div class="sub">28 km · arrivée 18:48</div>
  <div class="nav">
    <button><b>⌂</b>Accueil</button>
    <button><b>➤</b>Itinéraire</button>
    <button><b>⚠</b>Signalements</button>
    <button><b>☆</b>Favoris</button>
    <button><b>•••</b>Plus</button>
  </div>
  <div class="locate" id="status">GPS en attente…</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false}).setView([43.1242,5.9293],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

let marker=null, watchId=null;
const speedEl=document.getElementById('speed'), status=document.getElementById('status');

function updatePosition(pos){
  const {latitude,longitude,speed}=pos.coords;
  const kmh = Number.isFinite(speed) && speed >= 0 ? speed*3.6 : null;
  speedEl.textContent = kmh===null ? '--' : Math.round(kmh);
  status.textContent='GPS actif · position mise à jour';
  if(!marker){
    marker=L.marker([latitude,longitude]).addTo(map);
  } else marker.setLatLng([latitude,longitude]);
  map.setView([latitude,longitude],16);
}
function gpsError(){
  status.textContent='GPS indisponible ou autorisation refusée';
}
if(navigator.geolocation){
  watchId=navigator.geolocation.watchPosition(updatePosition,gpsError,{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
}else status.textContent='Ce navigateur ne prend pas en charge le GPS';

document.getElementById('locate').onclick=()=>{ if(marker) map.setView(marker.getLatLng(),17); };
document.getElementById('sound').onclick=e=>{ e.currentTarget.textContent=e.currentTarget.textContent==='🔊'?'🔇':'🔊'; };
document.getElementById('report').onclick=()=>alert('Prototype : signalement à connecter à notre serveur.');
</script>
</body>
</html>
